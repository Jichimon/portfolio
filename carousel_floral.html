<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrusel floral</title>
  <style>
    :root {
      color-scheme: light;
      --page: #dedede;
      --ink: #fff;
      --active-w: 328px;
      --active-h: 411px;
      --side-w: 219px;
      --side-h: 273px;
      --side-gap: 13px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: var(--page);
      font-family: "Avenir Next", Avenir, Montserrat, "Segoe UI", sans-serif;
    }

    .demo {
      width: 100%;
      padding: 0 12px;
    }

    .carousel {
      position: relative;
      width: min(100%, 925px);
      height: 466px;
      margin: 0 auto;
      overflow: hidden;
      isolation: isolate;
    }

    .stage {
      position: absolute;
      inset: 0 15px 10px;
      width: auto;
      max-width: 895px;
      margin-inline: auto;
      overflow: visible;
    }

    .card {
      position: absolute;
      display: block;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 28px;
      background: linear-gradient(140deg, var(--bg-a), var(--bg-b));
      color: var(--ink);
      text-align: center;
      cursor: pointer;
      outline: none;
      box-shadow: 0 1px 1px rgba(36, 29, 55, .04);
      transform-origin: center center;
      transition:
        left 580ms cubic-bezier(.22,.75,.25,1),
        top 580ms cubic-bezier(.22,.75,.25,1),
        width 580ms cubic-bezier(.22,.75,.25,1),
        height 580ms cubic-bezier(.22,.75,.25,1),
        opacity 420ms ease,
        border-radius 580ms ease,
        filter 580ms ease,
        transform 580ms cubic-bezier(.22,.75,.25,1);
      -webkit-tap-highlight-color: transparent;
    }

    .card:focus-visible,
    .nav:focus-visible,
    .dot:focus-visible {
      outline: 3px solid rgba(255,255,255,.96);
      outline-offset: 4px;
    }

    .card[data-pos="active"] {
      z-index: 3;
      left: calc(50% - 164px);
      top: 16px;
      width: var(--active-w);
      height: var(--active-h);
      opacity: 1;
      border-radius: 33px;
      cursor: default;
      filter: saturate(1.06);
    }

    .card[data-pos="left"] {
      z-index: 2;
      left: calc(50% - 396px);
      top: 85px;
      width: var(--side-w);
      height: var(--side-h);
      opacity: 1;
      border-radius: 22px;
      filter: saturate(.84);
    }

    .card[data-pos="right"] {
      z-index: 2;
      left: calc(50% + 177px);
      top: 85px;
      width: var(--side-w);
      height: var(--side-h);
      opacity: 1;
      border-radius: 22px;
      filter: saturate(.9);
    }

    .card[data-pos="hidden"] {
      z-index: 0;
      left: 50%;
      top: 26px;
      width: var(--active-w);
      height: var(--active-h);
      opacity: 0;
      pointer-events: none;
      transform: scale(.86);
      visibility: hidden;
    }

    .art {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 42% 38%, rgba(255,255,255,.34), transparent 38%),
        radial-gradient(ellipse at 75% 18%, rgba(255,255,255,.18), transparent 32%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
    }

    .art::before,
    .art::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(18px);
    }

    .art::before {
      width: 62%; height: 54%;
      left: -15%; top: 10%;
      background: var(--haze-a);
      opacity: .38;
    }

    .art::after {
      width: 70%; height: 66%;
      right: -24%; bottom: -12%;
      background: var(--haze-b);
      opacity: .32;
    }

    .flower-svg {
      position: absolute;
      inset: -2% -6% -2% -6%;
      width: 112%;
      height: 104%;
      overflow: visible;
      opacity: .94;
      filter: drop-shadow(0 7px 8px rgba(48, 36, 73, .11));
    }

    .stem {
      fill: none;
      stroke: var(--stem);
      stroke-width: 5;
      stroke-linecap: round;
      opacity: .9;
    }

    .petal-a { fill: var(--petal-a); }
    .petal-b { fill: var(--petal-b); }
    .petal-c { fill: var(--petal-c); }
    .petal-edge { stroke: rgba(255,255,255,.28); stroke-width: 1.1; }

    .flower-center {
      fill: var(--center);
      stroke: rgba(255,255,255,.35);
      stroke-width: 2;
    }

    .wash {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.05) 0%, transparent 42%, rgba(48,39,69,.12) 100%);
      pointer-events: none;
    }

    .name {
      position: absolute;
      z-index: 2;
      left: 5%;
      right: 5%;
      bottom: 27%;
      margin: 0;
      color: rgba(255,255,255,.94);
      font-size: 42px;
      font-weight: 400;
      line-height: .95;
      letter-spacing: -.055em;
      text-shadow: 0 1px 12px rgba(255,255,255,.12);
      white-space: nowrap;
      transition: font-size 580ms ease, bottom 580ms ease;
      user-select: none;
    }

    .card[data-pos="active"] .name {
      bottom: 28%;
      font-size: 57px;
    }

    .card[data-pos="hidden"] .name { font-size: 57px; }

    /* Color palettes for each slide */
    .card[data-id="bloom"] {
      --bg-a: #b7d1cb; --bg-b: #526f6d;
      --haze-a: #e2d8c5; --haze-b: #284e4e;
      --petal-a: #e0a184; --petal-b: #c96d4d; --petal-c: #f5c0a2;
      --center: #763f2f; --stem: #395d5e;
    }

    .card[data-id="vivid"] {
      --bg-a: #b38abd; --bg-b: #565b9b;
      --haze-a: #e5a4bc; --haze-b: #7672c5;
      --petal-a: #fa9b91; --petal-b: #ea648b; --petal-c: #c078bf;
      --center: #61365e; --stem: #304b75;
    }

    .card[data-id="petaled"] {
      --bg-a: #f0d9a0; --bg-b: #d29b59;
      --haze-a: #fff4d3; --haze-b: #b97943;
      --petal-a: #fff2d8; --petal-b: #f6dfb6; --petal-c: #fff9e9;
      --center: #9e7248; --stem: #6c6d4c;
    }

    .card[data-id="serene"] {
      --bg-a: #dfb9bd; --bg-b: #8a728e;
      --haze-a: #f4d4c5; --haze-b: #6e779b;
      --petal-a: #f4c4bb; --petal-b: #bc88b9; --petal-c: #f7d9cf;
      --center: #81556f; --stem: #536a72;
    }

    .nav {
      position: absolute;
      z-index: 5;
      top: 47.5%;
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 50%;
      background: rgba(255,255,255,.52);
      color: #fff;
      box-shadow: 0 4px 14px rgba(72,68,74,.08);
      cursor: pointer;
      transform: translateY(-50%);
      transition: background 180ms ease, transform 180ms ease;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .nav:hover { background: rgba(255,255,255,.74); }
    .nav:active { transform: translateY(-50%) scale(.95); }
    .nav svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; }
    .nav--prev { left: 29px; }
    .nav--next { right: 60px; }

    .pagination {
      position: absolute;
      z-index: 6;
      bottom: 7px;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transform: translateX(-50%);
    }

    .dot {
      width: 20px;
      height: 5px;
      padding: 0;
      border: 0;
      border-radius: 99px;
      background: #b9b9b9;
      cursor: pointer;
      transition: width 260ms ease, background 260ms ease;
    }

    .dot[aria-current="true"] { width: 43px; background: #545454; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 680px) {
      :root {
        --active-w: min(70vw, 250px);
        --active-h: min(88vw, 330px);
        --side-w: 46vw;
        --side-h: min(58vw, 219px);
      }

      .demo { padding: 0; }
      .carousel { height: 400px; }
      .stage { inset: 0; height: 375px; }

      .card { border-radius: 22px; }
      .card[data-pos="active"] {
        left: 50%; top: 12px;
        transform: translateX(-50%);
        border-radius: 27px;
      }
      .card[data-pos="left"] {
        left: 0; top: 75px;
        transform: translateX(-72%);
        border-radius: 19px;
      }
      .card[data-pos="right"] {
        left: 100%; top: 75px;
        transform: translateX(-28%);
        border-radius: 19px;
      }
      .card[data-pos="hidden"] { left: 50%; transform: translateX(-50%) scale(.86); }
      .name { font-size: clamp(30px, 8vw, 39px); }
      .card[data-pos="active"] .name { font-size: clamp(44px, 13vw, 54px); }
      .nav { width: 38px; height: 38px; top: 48%; }
      .nav--prev { left: 10px; }
      .nav--next { right: 10px; }
      .pagination { bottom: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="demo">
    <section class="carousel" aria-label="Carrusel de flores">
      <div class="stage" id="stage">
        <button class="card" type="button" data-id="bloom" data-pos="left" aria-label="Mostrar Bloom">
          <div class="art" aria-hidden="true">

              <path class="stem" d="M164 228 C163 285 130 345 109 421" />
              <g transform="translate(151 210) rotate(-12)">
                <ellipse class="petal-a petal-edge" cx="0" cy="-55" rx="28" ry="83" transform="rotate(-54)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-55" rx="29" ry="87" transform="rotate(-8)" />
                <ellipse class="petal-c petal-edge" cx="0" cy="-55" rx="27" ry="82" transform="rotate(39)" />
                <ellipse class="petal-a petal-edge" cx="0" cy="-55" rx="28" ry="81" transform="rotate(83)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-55" rx="25" ry="74" transform="rotate(127)" />
                <ellipse class="petal-c petal-edge" cx="0" cy="-55" rx="27" ry="80" transform="rotate(168)" />
                <ellipse class="petal-a petal-edge" cx="0" cy="-55" rx="25" ry="78" transform="rotate(211)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-55" rx="26" ry="80" transform="rotate(254)" />
                <circle class="flower-center" r="13" />
              </g>
              <g opacity=".28" transform="translate(114 200) rotate(23) scale(.68)">
                <ellipse class="petal-c" cx="0" cy="-55" rx="27" ry="84" transform="rotate(20)" />
                <ellipse class="petal-b" cx="0" cy="-55" rx="25" ry="78" transform="rotate(85)" />
                <ellipse class="petal-a" cx="0" cy="-55" rx="27" ry="82" transform="rotate(145)" />
              </g>
            </svg>
          </div>
          <div class="wash" aria-hidden="true"></div>
          <span class="name">bloom</span>
        </button>

        <button class="card" type="button" data-id="vivid" data-pos="active" aria-label="Mostrar Vivid" aria-current="true">
          <div class="art" aria-hidden="true">
            <svg class="flower-svg" viewBox="0 0 328 411" role="presentation">
              <path class="stem" d="M164 226 C157 286 125 345 101 418" />
              <g opacity=".25" transform="translate(178 212) rotate(28) scale(1.12)">
                <ellipse class="petal-c" cx="0" cy="-57" rx="32" ry="94" transform="rotate(-32)" />
                <ellipse class="petal-b" cx="0" cy="-57" rx="29" ry="88" transform="rotate(30)" />
                <ellipse class="petal-a" cx="0" cy="-57" rx="30" ry="90" transform="rotate(90)" />
              </g>
              <g transform="translate(162 215) rotate(-13)">
                <ellipse class="petal-a petal-edge" cx="0" cy="-57" rx="31" ry="91" transform="rotate(-58)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-57" rx="29" ry="88" transform="rotate(-15)" />
                <ellipse class="petal-c petal-edge" cx="0" cy="-57" rx="30" ry="90" transform="rotate(29)" />
                <ellipse class="petal-a petal-edge" cx="0" cy="-57" rx="28" ry="85" transform="rotate(72)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-57" rx="27" ry="80" transform="rotate(115)" />
                <ellipse class="petal-c petal-edge" cx="0" cy="-57" rx="28" ry="88" transform="rotate(158)" />
                <ellipse class="petal-a petal-edge" cx="0" cy="-57" rx="27" ry="81" transform="rotate(201)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-57" rx="28" ry="88" transform="rotate(246)" />
                <circle class="flower-center" r="14" />
              </g>
            </svg>
          </div>
          <div class="wash" aria-hidden="true"></div>
          <span class="name">vivid</span>
        </button>

        <button class="card" type="button" data-id="petaled" data-pos="right" aria-label="Mostrar Petaled">
          <div class="art" aria-hidden="true">
            <svg class="flower-svg" viewBox="0 0 328 411" role="presentation">
              <path class="stem" d="M158 228 C168 295 183 344 198 421" />
              <g transform="translate(163 213) rotate(14)">
                <ellipse class="petal-c petal-edge" cx="0" cy="-55" rx="24" ry="83" transform="rotate(-68)" />
                <ellipse class="petal-a petal-edge" cx="0" cy="-55" rx="25" ry="88" transform="rotate(-31)" />
                <ellipse class="petal-c petal-edge" cx="0" cy="-55" rx="24" ry="83" transform="rotate(7)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-55" rx="23" ry="80" transform="rotate(45)" />
                <ellipse class="petal-c petal-edge" cx="0" cy="-55" rx="25" ry="88" transform="rotate(84)" />
                <ellipse class="petal-a petal-edge" cx="0" cy="-55" rx="24" ry="85" transform="rotate(123)" />
                <ellipse class="petal-c petal-edge" cx="0" cy="-55" rx="24" ry="83" transform="rotate(162)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-55" rx="22" ry="77" transform="rotate(204)" />
                <circle class="flower-center" r="10" />
              </g>
            </svg>
          </div>
          <div class="wash" aria-hidden="true"></div>
          <span class="name">petaled</span>
        </button>

        <button class="card" type="button" data-id="serene" data-pos="hidden" aria-label="Mostrar Serene" tabindex="-1" aria-hidden="true">
          <div class="art" aria-hidden="true">
            <svg class="flower-svg" viewBox="0 0 328 411" role="presentation">
              <path class="stem" d="M164 228 C147 292 149 346 126 419" />
              <g transform="translate(163 213) rotate(-18)">
                <ellipse class="petal-a petal-edge" cx="0" cy="-56" rx="28" ry="88" transform="rotate(-58)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-56" rx="27" ry="83" transform="rotate(-13)" />
                <ellipse class="petal-c petal-edge" cx="0" cy="-56" rx="29" ry="87" transform="rotate(33)" />
                <ellipse class="petal-a petal-edge" cx="0" cy="-56" rx="26" ry="80" transform="rotate(77)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-56" rx="26" ry="81" transform="rotate(123)" />
                <ellipse class="petal-c petal-edge" cx="0" cy="-56" rx="28" ry="86" transform="rotate(168)" />
                <ellipse class="petal-a petal-edge" cx="0" cy="-56" rx="27" ry="82" transform="rotate(213)" />
                <ellipse class="petal-b petal-edge" cx="0" cy="-56" rx="27" ry="82" transform="rotate(257)" />
                <circle class="flower-center" r="12" />
              </g>
            </svg>
          </div>
          <div class="wash" aria-hidden="true"></div>
          <span class="name">serene</span>
        </button>
      </div>

      <button class="nav nav--prev" type="button" aria-label="Anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8" /></svg>
      </button>
      <button class="nav nav--next" type="button" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8" /></svg>
      </button>
      <div class="pagination" role="group" aria-label="Elegir diapositiva">
        <button class="dot" type="button" aria-label="Diapositiva 1: Bloom" data-index="0"></button>
        <button class="dot" type="button" aria-label="Diapositiva 2: Vivid" data-index="1" aria-current="true"></button>
        <button class="dot" type="button" aria-label="Diapositiva 3: Petaled" data-index="2"></button>
        <button class="dot" type="button" aria-label="Diapositiva 4: Serene" data-index="3"></button>
      </div>
      <p class="sr-only" id="carousel-status" aria-live="polite">Diapositiva 2 de 4: Vivid</p>
    </section>
  </main>

  <script>
    (() => {
      const carousel = document.querySelector('.carousel');
      const stage = document.querySelector('#stage');
      const cards = Array.from(document.querySelectorAll('.card'));
      const dots = Array.from(document.querySelectorAll('.dot'));
      const previousButton = document.querySelector('.nav--prev');
      const nextButton = document.querySelector('.nav--next');
      const status = document.querySelector('#carousel-status');
      const total = cards.length;
      let activeIndex = 1;
      let pointerStartX = null;
      let suppressClick = false;

      /**
       * Positions the active card and its two neighboring cards, then updates accessibility state.
       * @param {number} index Index of the slide that should be active.
       * @returns {void}
       */
      function showSlide(index) {
        activeIndex = (index + total) % total;

        cards.forEach((card, cardIndex) => {
          const distance = (cardIndex - activeIndex + total) % total;
          let position = 'hidden';
          if (distance === 0) position = 'active';
          else if (distance === 1) position = 'right';
          else if (distance === total - 1) position = 'left';

          card.dataset.pos = position;
          card.setAttribute('aria-current', String(position === 'active'));
          card.setAttribute('aria-hidden', String(position === 'hidden'));
          card.tabIndex = position === 'hidden' ? -1 : 0;
          card.style.pointerEvents = position === 'hidden' ? 'none' : 'auto';
        });

        dots.forEach((dot, dotIndex) => {
          const isCurrent = dotIndex === activeIndex;
          dot.setAttribute('aria-current', String(isCurrent));
          dot.tabIndex = isCurrent ? 0 : -1;
        });

        const activeCard = cards[activeIndex];
        const title = activeCard.dataset.id;
        status.textContent = `Diapositiva ${activeIndex + 1} de ${total}: ${title.charAt(0).toUpperCase()}${title.slice(1)}`;
      }

      /**
       * Moves the carousel one slide in the requested direction.
       * @param {number} direction Use -1 for previous or 1 for next.
       * @returns {void}
       */
      function moveSlide(direction) {
        showSlide(activeIndex + direction);
      }

      previousButton.addEventListener('click', () => moveSlide(-1));
      nextButton.addEventListener('click', () => moveSlide(1));

      cards.forEach((card, index) => {
        card.addEventListener('click', () => {
          if (suppressClick) {
            suppressClick = false;
            return;
          }
          if (index !== activeIndex) showSlide(index);
        });
      });

      dots.forEach((dot) => {
        dot.addEventListener('click', () => showSlide(Number(dot.dataset.index)));
      });

      carousel.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          moveSlide(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          moveSlide(1);
        }
      });

      stage.addEventListener('pointerdown', (event) => {
        pointerStartX = event.clientX;
        suppressClick = false;
      }, { passive: true });

      stage.addEventListener('pointerup', (event) => {
        if (pointerStartX === null) return;
        const distance = event.clientX - pointerStartX;
        pointerStartX = null;
        if (Math.abs(distance) < 45) return;
        suppressClick = true;
        moveSlide(distance < 0 ? 1 : -1);
      }, { passive: true });

      stage.addEventListener('pointercancel', () => { pointerStartX = null; });

      showSlide(activeIndex);
    })();
  </script>
</body>
</html>
