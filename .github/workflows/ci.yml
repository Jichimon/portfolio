name: ci

# RENAMED FROM `harness.yml` ON 2026-09-01 (TASK 32), when the deploy job below landed.
# Until then this file only gated; now it gates on EVERY trigger and deploys on ONE, so a
# pull_request run, a nightly `full` run and a push to any branch but main all verify and
# ship nothing. `ci` describes that; `harness` described the file before the deploy job, and
# `deploy` would have misdescribed the majority of its runs. Two costs, recorded rather than
# discovered: GitHub opened a NEW entry in the Actions tab, so runs 33570798170 (TASK 30's
# green push) and 33571567866 (TASK 111's full-profile dispatch) stay reachable only under
# the old workflow name; and the README badge was dead until this file's first run.
#
# NO `paths:` FILTER, DELIBERATELY.
#
# INC-08: two workflows filtered on `paths:` for their own directories, so a guard added at
# the repository root ran in CI exactly zero times since it was written — and nobody could
# tell, because the local gate was green. The cost of running this on a docs-only commit is
# a few seconds. The cost of the filter was months of a guard that never fired.
#
# `check-ci` fails this file if a filter is ever added back.
#
# ONE WORKFLOW FILE, DELIBERATELY, and it is the same reasoning one level up: `check-docs`
# validates `.github/workflows/ci.yml` BY NAME. A second workflow file would carry no
# guard at all — no path-filter check, no gate-parity check, no Node floor — which is
# INC-08's shape arriving through a filename instead of through a filter. The deep tier is
# therefore a trigger of this workflow, never a workflow of its own.
#
# TASK 32 tested that reasoning and kept it: the DEPLOY is a JOB in this file, not a
# `deploy.yml`. Two files were priced and declined. A separate deploy workflow would have
# carried no guard, and — because the item requires the gate to run before a deploy — it
# would have run the whole gate a SECOND time on every push to main. `needs: gate` gets the
# same guarantee from the run that already happened.
#
# TASK 106: this workflow runs against a real remote and reports a real result — the
# INERT-UNTIL-A-REMOTE comment this file carried until 2026-09-01 stopped being true the
# day TASK 30 pushed.
#
# TASK 110 / INC-18: three consecutive runs were cancelled at their job timeout — one at the
# GitHub default of six hours, two at 90 minutes — and every one of them was read as "the
# gate is too slow". It was not. `astro preview` decides between a foreground server and a
# detached daemon by asking whether an AI coding agent is running it (`am-i-vibing`, whose
# environment list has CLAUDECODE in it and GITHUB_ACTIONS not in it). Locally the gate runs
# inside an agent, so the preview daemonized and the e2e suite worked; on a runner the same
# command blocked forever in globalSetup, and the job died having verified nothing. The fix
# is one flag in site/tests/e2e/preview-lifecycle.ts; the reason it cost three runs to find
# is that the gate printed nothing while it hung, which TASK 110 also closed.

on:
  push:
  pull_request:
  # The deep tier: everything the per-push profile defers — the full mutation run over
  # ~7,900 mutants and the visual-capture matrix. Nightly rather than never, because a
  # check that only runs when somebody remembers is a check that runs zero times (INC-08),
  # and on-demand as well, because "wait until tonight" is not an answer when the question
  # is whether a change is safe to close. 05:00 UTC is 01:00 in the author's timezone.
  # NOTE: GitHub disables scheduled workflows after 60 days without repository activity.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Gate profile to run'
        type: choice
        options: [full, fast]
        default: full

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # The profile is DERIVED from the trigger rather than duplicated into a second job.
    # Two jobs sharing eight setup steps drift, and nothing in `check-ci` would notice one
    # of the copies losing a step — the same class of silent divergence this whole file is
    # organised against.
    #
    # `github.event.inputs.profile`, NOT `inputs.profile`. The `inputs` context is only
    # available to manually-triggered and reusable workflows, so on a push it is not merely
    # empty — the expression can fail to parse, which fails the run before a single step
    # executes. The event-payload spelling is null on a push and is read by the `||` chain
    # as such. A workflow that cannot start is a worse failure than the one this file is
    # being edited to fix.
    env:
      GATE_PROFILE: ${{ (github.event_name == 'schedule' && 'full') || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile) || 'fast' }}
    # A backstop, not the real bound. The real bound is per-step and lives in
    # scripts/gate.mjs's STEPS array (TASK 110), where a hung step fails by name in minutes
    # instead of consuming the job's whole budget in silence. These two numbers are CHOSEN,
    # not measured (C-01): the first runs under the new per-step timing are what correct
    # them. If the expression ever fails to evaluate, replace it with the larger constant —
    # losing the tight fast bound costs a slower failure, and nothing else.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 150 || 25 }}
    steps:
      - uses: actions/checkout@v7
        with:
          # check-status-history derives K2 from `git log -- TASKS.md`. The default
          # fetch-depth of 1 hands it a single commit with no history to diff, and it would
          # report a clean zero-transitions window that measures the checkout, not the
          # register (T-10: read the real result, don't trust what a shallow clone implies).
          fetch-depth: 0

      # cache: 'npm' caches npm's download cache (~/.npm on ubuntu-latest), keyed on a hash of
      # both lockfiles below — not a workspace, so both need naming (S-07: site/ is its own
      # package). This does not skip `npm ci` itself, only the network fetch inside it: a
      # cache hit still reinstalls from the local cache, which is fast. Spike, 2026-09-01, CI
      # cost only — nothing here changes what installs or what the gate verifies.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # The mutation step (TASK 15) runs Stryker from the root node_modules. It is deferred
      # on a push (TASK 111) rather than skipped — a DEFER is a decision this file makes and
      # the gate prints by name, while a SKIP would be the step's own precondition missing.
      # The install stays unconditional so the two profiles run against identical trees: a
      # setup step that only happens sometimes is a difference nobody remembers when the
      # nightly run fails and the push run did not.
      # `npm ci` rather than `npm install`, because the root lockfile is committed for exactly
      # this.
      - run: npm ci

      # site/ is its own package, not an npm workspace — `npm ci` at the root never touches
      # it. Without this, `site/node_modules` is absent on the runner and three gate steps
      # (type check, component tests, e2e smoke) resolve a binary that was never installed,
      # which reads as a plain FAIL rather than the missing-install it actually is. Found by
      # simulating a fresh checkout against gate-steps.mjs's own validator (TASK 106).
      - run: npm ci
        working-directory: site

      # Cache the downloaded browser binaries, keyed on the installed @playwright/test version
      # so a version bump invalidates it automatically rather than silently running stale
      # browsers. Read AFTER `npm ci` in site/, because the version comes from the package
      # actually installed, not a string copied from package.json that could drift from the
      # lockfile. Spike, 2026-09-01 — same CI-cost-only scope as the npm cache above.
      - name: read installed Playwright version
        id: playwright-version
        working-directory: site
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # e2e drives a real browser engine against the built site (T-02) — Chromium only
      # as of TASK 108 (ADR-006, 2026-09-01); still a real build, never a mock. `npm ci`
      # installs the @playwright/test package, never the browser binaries themselves — those
      # are a separate download this repository's dev machine already has and a fresh runner
      # does not. Needed in BOTH profiles: `e2e smoke` is a fast-tier step. `--with-deps`
      # also apt-get installs OS-level dependencies, which a browser cache hit does not need
      # repeated — install-deps alone covers that path so a cache hit still gets the plain
      # `playwright install` skipped without silently missing OS deps on a runner image that
      # changed under it.
      - name: install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        working-directory: site

      - name: install Playwright OS dependencies (browsers already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
        working-directory: site

      # Restores the mutation step's incremental cache (stryker.config.mjs) from the most
      # recent prior deep run via the restore-keys prefix — CI has no working directory that
      # survives between runs, so without this the incremental setting there does nothing
      # here. Only on the profile that actually runs mutation: on a push the step is
      # deferred, and restoring a cache for a step that will not run is noise in the log.
      # Read-only: a miss just means the mutation step runs cold. NOT YET the basis for the
      # ratchet (T-03) — see stryker.config.mjs's own note on what still needs proving.
      - name: restore Stryker incremental cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v6
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-

      # One command, matching exactly what a human runs locally (T-09). CI must not re-list
      # the gate's steps: a step added to the gate would then be silently absent from CI,
      # and the local run would verify more than CI does.
      #
      # THE PROFILE IS PASSED EXPLICITLY, never left to the default. `fast` is what a bare
      # `node scripts/gate.mjs` runs, so the push job could have omitted the flag — writing
      # it out means the Actions log states which profile produced the verdict, and a reader
      # of a green run never has to infer what "green" covered. The gate's own headline says
      # it too, and names every deferred step.
      #
      # The verdict is read rather than assumed. gate.mjs exits 0 PASSED, 1 FAILED, 2
      # INCOMPLETE (one or more steps SKIPPED rather than run). A DEFER is none of those: it
      # is a step this profile does not run, printed by name, and it does not move the exit
      # code — the heavy tier runs nightly, and the log says so on every push.
      # private/banned-terms.txt is gitignored and never reaches this runner by design (H-04)
      # — the confidentiality check runs only on a machine that holds the mapping — so the
      # 'confidentiality' step is the one step this workflow expects to see skipped. An
      # INCOMPLETE run is accepted ONLY when that is the single skip; any other skip, or a
      # skip alongside a real failure, still fails the job. A silently-accepted arbitrary
      # skip is INC-08's exact shape, so this gate is a property of the summary, not a
      # blanket "exit code 2 is fine".
      # STREAMED THROUGH `tee`, not redirected-then-`cat`-ed at the end (TASK 107, corrected
      # after the first real run went 6 hours with an empty log). `node scripts/gate.mjs >
      # gate.log 2>&1` buffers everything until the process exits, so a merely-slow run shows
      # nothing in the live Actions log, and a cancelled or timed-out run leaves nothing to
      # read post-mortem either. `${PIPESTATUS[0]}` reads node's own exit code rather than
      # tee's, which always succeeds — a plain `$?` after a pipe would read the wrong process.
      # TASK 110 added the other half that was missing: the gate writes a `>` line before each
      # step and a `<` line after it, to STDERR, which is inherited rather than captured. A
      # run cancelled mid-step now names the step it died in — the 89 minutes of silence that
      # produced no diagnosis at all is what motivated it.
      - name: run the gate
        run: |
          set +e
          node scripts/gate.mjs --profile "$GATE_PROFILE" 2>&1 | tee gate.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 2 ]; then
            # The count comes from the "GATE INCOMPLETE — N of 22..." header line, not from
            # counting SKIP lines directly: gate.mjs prints each skipped step TWICE — once in
            # the padded summary table, once in the incomplete-detail block below it — and a
            # plain `grep -c '^  SKIP  '` counts both, silently doubling every real count.
            # Proven in red before this shipped: a synthetic single-skip log scored skips=2
            # against the naive pattern and only the header-derived count read 1.
            skips=$(sed -n 's/^GATE INCOMPLETE — \([0-9]\+\) of [0-9]\+ step(s) did not run:/\1/p' gate.log)
            conf=$(grep -c '^  SKIP  confidentiality' gate.log || true)
            if [ "$skips" = "1" ] && [ "$conf" = "1" ]; then
              echo "::warning::GATE INCOMPLETE — 'confidentiality' skipped: private/banned-terms.txt never reaches a runner by design (H-04). Every other step ran."
              exit 0
            fi
            echo "::error::GATE INCOMPLETE with an unexpected skip set — see the summary above. Only 'confidentiality' may be skipped in CI."
          fi
          exit $code

      # Saved unconditionally within the deep profile (`if: always()`), keyed on the run id so
      # every run writes a new entry rather than fighting the immutable-key restriction on an
      # existing one — a red gate still keeps whatever mutants that run resolved, so the next
      # deep run's restore step starts from THIS run's progress rather than the last green
      # one's. Skipped entirely on a push, where the mutation step is deferred and the file
      # this saves would not exist (that mismatch is what produced a `Path Validation Error`
      # warning on every run before TASK 111).
      - name: save Stryker incremental cache
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v6
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.run_id }}

  # TASK 32. The site reaches the internet through this job and through nothing else — no
  # manual `wrangler deploy` exists or ever ran. That is deliberate and it is the item's first
  # constraint: a manual path that keeps working is the reason nobody notices when the
  # automated one breaks.
  #
  # A JOB, NOT A SECOND WORKFLOW FILE. See the header — `check-docs` validates this file by
  # name, so a `deploy.yml` would carry no path-filter check, no gate-parity check and no Node
  # floor. It would also have run the whole gate a second time on every push to main, because
  # the item requires the gate to pass before a deploy and a separate workflow cannot see this
  # one's result. `needs: gate` gets that guarantee from the run that already happened.
  deploy:
    # THIS is how "the workflow runs the gate before deploying" is met. `needs` is a hard
    # dependency: a red or cancelled gate leaves this job unrun, with no `if:` reading an
    # outcome and no chance of the two disagreeing.
    needs: gate
    # Every OTHER trigger reaches `gate` and stops there. A pull_request run, the nightly
    # schedule and a manual dispatch all verify and ship nothing — correct in each case,
    # since none of them represents a change landing on the published branch. Secrets are
    # unavailable to fork pull_requests anyway, but that is a second line, not the reason.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two pushes in quick succession deploy IN ORDER rather than racing. cancel-in-progress
    # is false on purpose: cancelling the first would leave the live site on whichever
    # upload happened to finish last, which is the one outcome worse than a slow deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          # Only site/'s lockfile: this job never installs the root package, which carries
          # Stryker and nothing this job needs.
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      # THE DEPLOY JOB BUILDS EXPLICITLY, and does not consume an artifact from `gate`.
      # Passing site/dist between jobs was considered and declined: the gate's dist/ exists
      # only as a side effect of `e2e smoke`'s globalSetup building it, so depending on it
      # would mean a skipped or restructured test step silently ships stale bytes or none at
      # all. This is deterministic from the same commit and owns its own failure.
      - run: npm run build
        working-directory: site

      # `wranglerVersion` is DELIBERATELY not pinned here. The action uses the wrangler already
      # installed in the working directory, and `npm ci` above installs the version
      # site/package-lock.json pins — so the lockfile is the single declaration site for it. A
      # version written here as well would be a second one, free to drift from the first.
      - name: deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=portfolio --branch=main

      # A deploy step's exit code says a command succeeded; it does not say the site is
      # there. This walks every route the content collection derives — one derivation,
      # shared with the e2e suite (site/lib/content/routes/route-source.mjs) — against the
      # URL that was just deployed, and fails the job naming anything that is not a served
      # HTML page. INC-03 is this repository's own record of a build that looked fine and
      # was not; TASK 39 is its record of a step reporting PASS having run nothing.
      #
      # PROD_BASE_URL is read from the deploy step's OWN output rather than typed. That is
      # the single declaration site for the live address, and it is why the account's
      # workers.dev subdomain appears in no file in this repository (C-06). TASK 27's prod
      # fidelity leg reads the same variable name.
      - name: verify every derived route is live
        run: node scripts/verify-deploy.mjs
        env:
          PROD_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
