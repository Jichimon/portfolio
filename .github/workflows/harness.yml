name: harness

# NO `paths:` FILTER, DELIBERATELY.
#
# INC-08: two workflows filtered on `paths:` for their own directories, so a guard added at
# the repository root ran in CI exactly zero times since it was written — and nobody could
# tell, because the local gate was green. The cost of running this on a docs-only commit is
# a few seconds. The cost of the filter was months of a guard that never fired.
#
# `check-ci` fails this file if a filter is ever added back.
#
# TASK 106: this workflow now runs against a real remote and reports a real result — the
# INERT-UNTIL-A-REMOTE comment this file carried until 2026-09-01 stopped being true the
# day TASK 30 pushed. See TASK 106's own entry in TASKS.md for what was actually failing
# and why (site/ needed its own install, private/ never reaches a runner by design).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # TASK 107: the first real push (commit 059a7e5) ran for the full GitHub Actions default
    # of 6 hours and was cancelled with zero diagnostic output — the 'run the gate' step
    # redirected all output to a file and only printed it after the process exited, so a run
    # that never exits leaves nothing to read, live or after the fact (fixed below).
    #
    # Root cause, measured rather than guessed: Stryker's default concurrency is
    # os.availableParallelism() - 1 (its own source, concurrency-token-provider.js in
    # @stryker-mutator/core). The author's machine reports 12 cores -> concurrency 11;
    # GitHub's standard ubuntu-latest runner reports 2 -> concurrency 2. A 5x drop in
    # parallel test-runner processes, on generally slower shared cloud cores, plausibly turns
    # a ~10-11min local cold mutation run into hours rather than minutes — not a hang.
    #
    # 90 is a provisional bound, not a measured one. This run is the first with output
    # actually visible (see the streaming fix below); its real timing is what should set this
    # number honestly on the next pass, instead of guessing twice.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # check-status-history derives K2 from `git log -- TASKS.md`. The default
          # fetch-depth of 1 hands it a single commit with no history to diff, and it would
          # report a clean zero-transitions window that measures the checkout, not the
          # register (T-10: read the real result, don't trust what a shallow clone implies).
          fetch-depth: 0

      # cache: 'npm' caches npm's download cache (~/.npm on ubuntu-latest), keyed on a hash of
      # both lockfiles below — not a workspace, so both need naming (S-07: site/ is its own
      # package). This does not skip `npm ci` itself, only the network fetch inside it: a
      # cache hit still reinstalls from the local cache, which is fast. Spike, 2026-09-01, CI
      # cost only — nothing here changes what installs or what the gate verifies.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # The mutation step (TASK 15) runs Stryker from the root node_modules. Without an install
      # here its skipIf fires and the step is skipped — and a SKIP still exits 0, which
      # is INC-08's shape: a check that exists in CI and runs exactly zero times, invisibly.
      # `npm ci` rather than `npm install`, because the root lockfile is committed for exactly
      # this. It costs ~30s and the mutation run costs ~2.5min; that is the price of CI parity.
      - run: npm ci

      # site/ is its own package, not an npm workspace — `npm ci` at the root never touches
      # it. Without this, `site/node_modules` is absent on the runner and three gate steps
      # (type check, component tests, e2e smoke) resolve a binary that was never installed,
      # which reads as a plain FAIL rather than the missing-install it actually is. Found by
      # simulating a fresh checkout against gate-steps.mjs's own validator (TASK 106).
      - run: npm ci
        working-directory: site

      # Cache the downloaded browser binaries, keyed on the installed @playwright/test version
      # so a version bump invalidates it automatically rather than silently running stale
      # browsers. Read AFTER `npm ci` in site/, because the version comes from the package
      # actually installed, not a string copied from package.json that could drift from the
      # lockfile. Spike, 2026-09-01 — same CI-cost-only scope as the npm cache above.
      - name: read installed Playwright version
        id: playwright-version
        working-directory: site
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # e2e smoke drives a real browser engine against the built site (T-02) — Chromium only
      # as of TASK 108 (ADR-006, 2026-09-01); still a real build, never a mock. `npm ci`
      # installs the @playwright/test package, never the browser binaries themselves — those
      # are a separate download this repository's dev machine already has and a fresh runner
      # does not. `--with-deps` also apt-get installs OS-level dependencies, which a browser
      # cache hit does not need repeated — install-deps alone covers that path so a cache hit
      # still gets the plain `playwright install` skipped without silently missing OS deps
      # on a runner image that changed under it.
      - name: install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        working-directory: site

      - name: install Playwright OS dependencies (browsers already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
        working-directory: site

      # Spike, 2026-09-01: restores the mutation step's incremental cache (stryker.config.mjs)
      # from the most recent prior run via the restore-keys prefix — CI has no working
      # directory that survives between runs, so without this the incremental setting there
      # does nothing here. Read-only: a miss just means the mutation step runs cold, same as
      # today. NOT YET the basis for the ratchet (T-03) — see stryker.config.mjs's own note on
      # what still needs proving before it is.
      - name: restore Stryker incremental cache
        uses: actions/cache/restore@v6
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-

      # One command, matching exactly what a human runs locally (T-09). CI must not re-list
      # the gate's steps: a step added to the gate would then be silently absent from CI,
      # and the local run would verify more than CI does.
      #
      # The verdict is read rather than assumed. gate.mjs exits 0 PASSED, 1 FAILED, 2
      # INCOMPLETE (one or more steps SKIPPED rather than run). private/banned-terms.txt is
      # gitignored and never reaches this runner by design (H-04) — the confidentiality check
      # runs only on a machine that holds the mapping — so the 'confidentiality' step is the
      # one step this workflow expects to see skipped. An INCOMPLETE run is accepted ONLY when
      # that is the single skip; any other skip, or a skip alongside a real failure, still
      # fails the job. A silently-accepted arbitrary skip is INC-08's exact shape, so this
      # gate is a property of the summary, not a blanket "exit code 2 is fine".
      # STREAMED THROUGH `tee`, not redirected-then-`cat`-ed at the end (TASK 107, corrected
      # after the first real run went 6 hours with an empty log). `node scripts/gate.mjs >
      # gate.log 2>&1` buffers everything until the process exits, so a merely-slow run shows
      # nothing in the live Actions log, and a cancelled or timed-out run leaves nothing to
      # read post-mortem either. `${PIPESTATUS[0]}` reads node's own exit code rather than
      # tee's, which always succeeds — a plain `$?` after a pipe would read the wrong process.
      - name: run the gate
        run: |
          set +e
          node scripts/gate.mjs 2>&1 | tee gate.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 2 ]; then
            # The count comes from the "GATE INCOMPLETE — N of 20..." header line, not from
            # counting SKIP lines directly: gate.mjs prints each skipped step TWICE — once in
            # the padded summary table, once in the incomplete-detail block below it — and a
            # plain `grep -c '^  SKIP  '` counts both, silently doubling every real count.
            # Proven in red before this shipped: a synthetic single-skip log scored skips=2
            # against the naive pattern and only the header-derived count read 1.
            skips=$(sed -n 's/^GATE INCOMPLETE — \([0-9]\+\) of [0-9]\+ step(s) did not run:/\1/p' gate.log)
            conf=$(grep -c '^  SKIP  confidentiality' gate.log || true)
            if [ "$skips" = "1" ] && [ "$conf" = "1" ]; then
              echo "::warning::GATE INCOMPLETE — 'confidentiality' skipped: private/banned-terms.txt never reaches a runner by design (H-04). Every other step ran."
              exit 0
            fi
            echo "::error::GATE INCOMPLETE with an unexpected skip set — see the summary above. Only 'confidentiality' may be skipped in CI."
          fi
          exit $code

      # Saved unconditionally (`if: always()`), keyed on the run id so every run writes a new
      # entry rather than fighting the immutable-key restriction on an existing one — a red
      # gate still keeps whatever mutants that run resolved, so the next run's restore step
      # starts from THIS run's progress rather than the last green one's. Spike, 2026-09-01.
      - name: save Stryker incremental cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.run_id }}
